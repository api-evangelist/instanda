name: INSTANDA
kind: company
description: >-
  INSTANDA is a London-headquartered no-code insurance core-systems vendor, trading
  as F2X Group Limited (England and Wales no. 05236974) from 70 Gracechurch Street in
  the City of London, a few streets from Lloyd's. Founded in 2015 by Tim Hardcastle
  (CEO) and Derek Hill (Group CRO), it sells a cloud-native policy administration and
  digital distribution platform to insurance carriers, MGAs and brokers, letting
  business users configure products, rating, rules, documents, agent/broker portals
  and direct-to-consumer journeys without writing code. Its footprint spans property
  and casualty, life and health, and specialty lines across the UK, EMEA, North
  America and APAC, and it is architected on Microsoft Azure. INSTANDA markets itself
  as "API-first" and its platform does generate per-product REST/SOAP interfaces
  described with Swagger or WSDL definitions, plus Event Webhooks that HTTP POST
  customer event notifications to a subscriber-supplied URL - but none of that
  contract is public. There is no first-party developer portal: developer,
  developers, docs and api-docs subdomains all return 404, api.instanda.com
  resolves but answers anonymous requests with a bare 403, and support.instanda.com
  is a Freshdesk login wall. The Swagger surface has been located and it is gated -
  design.instanda.com/swagger/index.html is a registered route that redirects to the
  platform log-on page, while unknown paths on the same host hard-404. What INSTANDA
  does publish openly is a component-level status page at status.instanda.com
  covering four hosting regions, and a certification set of ISO 27001:2022, SOC 2,
  Cyber Essentials and PCI DSS SAQ A. Quote, bind, issue and FNOL all exist as
  platform capabilities - the status page names Quote Engine, Referrals, Renewals,
  MTAs, Endorsements and Claims as monitored services - but every one of them is
  reachable only through a licensed tenant or a partner integration. The honest
  finding is a partner-gated insurance core system with no public self-serve API.
