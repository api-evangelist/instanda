  status: 404
- url: https://instanda.com/developers
  status: 404
- url: https://instanda.com/api
  status: 404
- url: https://instanda.com/developer
  status: 404
- url: https://instanda.com/integrations
  status: 404
- url: https://instanda.com/partners
  status: 200
  note: Real integration directory (integration partners, implementation partners,
    industry organizations) - marketing, not developer documentation.
- url: https://support.instanda.com/
  status: 302
  note: Redirects to https://support.instanda.com/support/login and then to Freshworks
    OAuth. Login wall - customer knowledge base, not a public developer portal.
- url: https://instanda.com/.well-known/security.txt
  status: 404
- url: https://app.trustero.com/trust/instanda
  status: 200
  note: Third-party hosted trust centre linked from the site footer. Client-rendered
    React shell - served HTML carries the title "Trustero" and no certification text,
    so nothing is harvestable without executing JavaScript.
- url: https://status.instanda.com/
  status: 200
  note: 2026-07-25 - PUBLIC component-level status page (SorryApp), four regions, no
    login. Found by DNS sweep; not linked from the instanda.com footer.
- url: https://design.instanda.com/
  status: 200
  note: 2026-07-25 - tenant product-configuration application (ASP.NET on Azure),
    found via the Disallow line in instanda.com/robots.txt. Renders the INSTANDA Log
    On page anonymously.
- url: https://design.instanda.com/swagger/index.html
  status: 302
  note: 2026-07-25 - REGISTERED, AUTHENTICATION-GATED Swagger UI route. HEAD returns
    302 -> /Account/LogOn?ReturnUrl=%2fswagger%2findex.html repeatably; GET 302s to
    /Public/BrokenLink. Unknown paths on the same host hard-404, which is how the
    route was confirmed to exist rather than being wildcard behaviour.
- url: https://design.instanda.com/zzzfake
  status: 404
  note: Control probe - proves design.instanda.com is not a catch-all and that the
    /swagger/index.html 302 is a real registered route.
- url: https://design.instanda.com/.well-known/security.txt
  status: 302
  note: 302 to /Public/BrokenLink - the application's broken-link handler, not a
    served document. Same for /.well-known/openid-configuration and
    /.well-known/oauth-authorization-server on this host.
- url: https://api.instanda.com/openapi.yaml
  status: 404
- url: https://api.instanda.com/swagger.json
  status: 404
- url: https://api.instanda.com/graphql
  status: 404
  note: Re-probed 2026-07-25; no GraphQL surface to introspect.
- url: https://api.instanda.com/.well-known/oauth-protected-resource
