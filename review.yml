  note: Marketing site (HubSpot CMS). www.instanda.com 301s to the apex.
- url: https://developer.instanda.com/
  status: 404
- url: https://developers.instanda.com/
  status: 404
- url: https://docs.instanda.com/
  status: 404
- url: https://api-docs.instanda.com/
  status: 404
- url: https://developerhub.instanda.com/
  status: 404
- url: https://api.instanda.com/
