sources:
- url: https://instanda.com/cloud
  type: Documentation
  note: "First-party statement of the integration model: 'You can connect through REST
    or SOAP services using Swagger or WSDL definitions, while WebHooks handle real-time
    customer event notifications.'"
- url: https://instanda.com/us/solution/distribute/
  type: Documentation
  note: Names quote, bind, policy changes, billing, document viewing and FNOL as
    policyholder capabilities, and headless/embedded distribution "via API".
- url: https://instanda.com/us/solution/create/
  type: Documentation
  note: Rating engine detail including API-call-out rating steps and bureau-agnostic
    rating (ISO, AAIS, MSO, NCCI); "automate third-party API mapping".
- url: https://instanda.com/partners
  type: Partners
  note: Integration ecosystem directory; source for the Applied Systems (Applied TAM)
    broker management system link and the identity/data/payment partner set.
- url: https://instanda.com/our-company
  type: Website
  note: "Company facts: co-founders Tim Hardcastle (CEO) and Derek Hill (Group CRO),
    platform created 2015, $45M funding secured in 2022; footer carries F2X Group
    Limited registration and the London EC3V 0HR address."
- url: https://instanda.com/news/new-microsoft-aligned-api-framework-set-to-transform-insurance-digital-ecosystems/
  type: News
  status: 200
  note: URL still resolves but now renders the Resource Hub index rather than the
    article body; the article is cited in search indexes as describing an API
    framework built on "the Microsoft Azure preferred interface definition language,
    Swagger", letting business users create external APIs for products hosted in
    INSTANDA. Recorded as an attributed claim, not as harvested first-party text.
enrichment:
- round: '2026-07-25'
  method: search + probe
  summary: |
    Second pass. The headline answer does not change - INSTANDA still publishes
    no self-serve developer portal and no retrievable API definition - but three
    real public surfaces the first round missed were found and captured:
    (1) status.instanda.com, a public component-level status page that also
    carries the best public description of the Event Webhooks contract;
    (2) design.instanda.com, the tenant configuration application, reached via
    the Disallow line in robots.txt, where a Swagger UI route is confirmed
    registered and authentication-gated; and (3) a named certification set
    (ISO 27001:2022, SOC 2, Cyber Essentials, PCI DSS SAQ A) on the first-party
    platform-security page. apis[] stays empty - listing an API whose contract
    is generated per tenant and never published would still be fabrication.
  artifactsWritten:
  - lifecycle/instanda-lifecycle.yml
  - asyncapi/instanda-webhooks.yml
  - conformance/instanda-conformance.yml
  - security/instanda-domain-security.yml
  - security/instanda-trust-center.yml
  - well-known/instanda-well-known.yml
  - llms/instanda-llms.txt
  stillAbsent:
  - OpenAPI / Swagger document
  - WSDL
  - GraphQL
  - gRPC / protobuf
  - AsyncAPI
  - MCP server
  - SDKs / packages
  - CLI
  - first-party Postman workspace
  - public changelog, roadmap, pricing or SLA
  - sandbox / test credentials
  - security.txt and vulnerability disclosure policy
  reReviewTrigger: >-
    Re-review if design.instanda.com/swagger/index.html ever serves a document
    anonymously, if a developer subdomain appears, or if INSTANDA publishes an
    event catalog for Event Webhooks.
actions:
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    apis[] is intentionally empty. INSTANDA publishes no documented, publicly
    reachable API, so listing one would be fabrication. The accurate record is a
    partner-gated core system whose API surface is generated per tenant and never
    exposed. Re-review if INSTANDA ever launches a public developer portal or
    publishes product Swagger definitions outside a customer tenant.
